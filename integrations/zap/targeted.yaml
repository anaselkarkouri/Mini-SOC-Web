# Deux règles actives; cible interne fixe, aucune console SOC ni URL publique.
env:
  contexts:
    - name: minisoc-local
      urls: ['http://web/search.php?q=AtlasPhone']
      includePaths: ['http://web/search\.php.*']
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  - type: requestor
    requests:
      - url: 'http://web/search.php?q=AtlasPhone'
        responseCode: 200
  - type: activeScan
    parameters:
      context: minisoc-local
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 3
      threadPerHost: 1
      delayInMs: 25
    policyDefinition:
      defaultStrength: Low
      defaultThreshold: 'Off'
      rules:
        - id: 40012
          strength: Low
          threshold: Medium
        - id: 40018
          strength: Low
          threshold: Medium
  - type: passiveScan-wait
    parameters:
      maxDuration: 1
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-targeted
      reportTitle: Mini-SOC - scan ciblé de laboratoire
      reportDescription: Deux règles actives SQLi/XSS sur search.php; aucun audit exhaustif.
      displayReport: false
