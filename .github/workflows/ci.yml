name: Mini SOC verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mini_siem/requirements.txt
      - run: python -m unittest -v test_detection
        working-directory: mini_siem
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
