<DirectoryMatch "^/var/www/html/(config|database|mini_siem|scripts|tests|docker|runtime|\.git)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(\.env.*|Dockerfile.*|compose\.yaml|.*\.local\.php)$">
    Require all denied
</FilesMatch>
<Directory /var/www/html>
    Options -Indexes
</Directory>
